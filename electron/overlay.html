<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        user-select: none;
      }
      #box {
        width: 420px;
        height: 276px;
        box-sizing: border-box;
        background: #12141a;
        border: 1px solid #2a3140;
        border-radius: 10px;
        padding: 6px 10px 8px;
        opacity: 0.92;
        color: #f0f0f0;
      }
      .head {
        text-align: right;
        color: #7a8494;
        font-size: 11px;
        margin-bottom: 4px;
      }
      #lines {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .line {
        text-align: right;
        font-size: 13px;
        line-height: 1.35;
        word-break: break-all;
      }
      .ok { color: #8fef9a; }
      .fail { color: #f0f0f0; }
    </style>
  </head>
  <body>
    <div id="box">
      <div class="head">匹配进度</div>
      <div id="lines"></div>
    </div>
    <script src="./overlay.js"></script>
  </body>
</html>
